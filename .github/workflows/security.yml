name: Security checks

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '29 9 * * 1'

permissions:
  contents: read

jobs:
  dependencies-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
